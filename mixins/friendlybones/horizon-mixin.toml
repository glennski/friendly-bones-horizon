[mod]
id = "friendlybones"
version = "0.2.0"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The companion runtime: decisions, AI goals, persistence, the native menu.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "friendlybones"
source = "runtime.rs"

# --- Hook points (named, stable contracts) ---------------------------------
[[injection]]
id = "world"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "hooks/world.rs"
bindings = [{ name = "phase", ty = "WorldPhase", value = "phase" }]

[[injection]]
id = "tick-pre"
hook = "level_tick_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/tick_pre.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "tick-post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "use-item"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "hooks/use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "interact"
hook = "interact_entity"
hook_version = 1
kind = "HEAD"
helper = "hooks/interact.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "net-client"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "hooks/net_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net-server"
hook = "net_from_server"
hook_version = 1
kind = "HEAD"
helper = "hooks/net_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "loot"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "hooks/loot.rs"
bindings = [
  { name = "context", ty = "&NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<ItemStack>", value = "&mut *drops" },
]

# --- Client menu ------------------------------------------------------------
[[injection]]
id = "ui-render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "hooks/ui_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "ui-press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/ui_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "ui-release"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/ui_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "ui-key"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "hooks/ui_key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "ui-closing"
hook = "screen_closing"
hook_version = 1
kind = "HEAD"
helper = "hooks/ui_closing.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
]

# --- Hook points without a catalog name at this commit (pinned to it) -----
[[injection]]
id = "ui-tick"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_tick_pre"
kind = "HEAD"
helper = "hooks/ui_tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "damage-in"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage_v3"
kind = "HEAD"
helper = "hooks/damage_in.rs"
bindings = [
  { name = "victim", ty = "u32", value = "victim" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "attacker", ty = "Option<u32>", value = "attacker" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
]

[[injection]]
id = "damage-post"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_damage_post"
kind = "HEAD"
helper = "hooks/damage_post.rs"
bindings = [
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "causing", ty = "i32", value = "causing" },
  { name = "amount", ty = "f32", value = "amount" },
]

# --- Engine adjustments for the two companion types -------------------------
[[injection]]
id = "goals"
target = "horizon_client_lib::mobs::ai::native_register_goals"
kind = "HEAD"
helper = "patches/goals.rs"
bindings = [{ name = "mob", ty = "&mut Mob", value = "&mut *mob" }]

[[injection]]
id = "peaceful"
target = "horizon_client_lib::mobs::ai::check_despawn"
kind = "MODIFY_EXPRESSION_VALUE"
selector = "super::spawn_rules::allowed_in_peaceful(m.species())"
require = 1
ordinal = 0
helper = "patches/peaceful.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "m", ty = "&Mob", value = "&*m" },
]

[[injection]]
id = "entity-rows"
target = "horizon_client_lib::mod_content::Plan<'_>::entity_types_json"
kind = "HEAD"
cancellable = true
helper = "patches/entity_rows.rs"
bindings = [
  { name = "plan", ty = "&Plan<'_>", value = "self" },
  { name = "bytes", ty = "&[u8]", value = "bytes" },
]
